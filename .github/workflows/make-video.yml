name: make-video
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Episode folder in what-if-studio/src/episodes"
        required: true
        default: voice-test
      stage:
        description: "voice = Chatterbox voice + shot timing (committed back) | board = storyboard stills | render = final mastered MP4"
        type: choice
        options: [voice, board, render]
        default: voice
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SKILL: ${{ github.workspace }}/.claude/skills/what-if-animation
      SLUG: ${{ inputs.slug }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    defaults:
      run:
        working-directory: what-if-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: what-if-studio/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System packages
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Python deps
        run: pip install -q numpy pillow soundfile
      - name: Chatterbox (CPU)
        if: inputs.stage == 'voice'
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "setuptools<81" chatterbox-tts faster-whisper
      - uses: actions/cache@v4
        if: inputs.stage == 'voice'
        with: { path: "~/.cache/huggingface", key: hf-chatterbox-v1 }
      - name: Voice
        if: inputs.stage == 'voice'
        run: |
          python "$SKILL/scripts/voice.py" "$SLUG"
          if grep -q '"edit"' "src/episodes/$SLUG/episode.json"; then python "$SKILL/scripts/plan.py" "$SLUG"; fi
      - name: Commit voice files back
        if: inputs.stage == 'voice'
        working-directory: .
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f "what-if-studio/public/$SLUG" "what-if-studio/src/episodes/$SLUG"
          git diff --cached --quiet || (git commit -qm "voice: $SLUG (Chatterbox)" && git push)
      - name: Install studio
        if: inputs.stage != 'voice'
        run: npm ci --no-audit --no-fund
      - name: Storyboard
        if: inputs.stage == 'board'
        run: |
          npx tsc --noEmit
          node "$SKILL/scripts/stills.mjs" "$SLUG"
          python "$SKILL/scripts/board.py" "$SLUG"
      - name: Render and master
        if: inputs.stage == 'render'
        run: python "$SKILL/scripts/master.py" "$SLUG"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.stage != 'voice'
        with: { name: "${{ inputs.slug }}-${{ inputs.stage }}", path: "what-if-studio/out/${{ inputs.slug }}", retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always() && inputs.stage == 'voice'
        with: { name: "${{ inputs.slug }}-voice", path: "what-if-studio/public/${{ inputs.slug }}", retention-days: 14 }
