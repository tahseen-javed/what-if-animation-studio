name: checks
# Owner checks that are not part of a video: the voice A/B test and the library gallery (contact sheet + embedding
# distances between sets).
on:
  workflow_dispatch:
    inputs:
      sets:
        description: "Comma list of sets for the gallery sheet (or all)"
        default: all
jobs:
  voice_ab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "setuptools<81" numpy chatterbox-tts
      - uses: actions/cache@v4
        with: { path: "~/.cache/huggingface", key: hf-chatterbox-v1 }
      - run: python tools/voice_ab.py
      - uses: actions/upload-artifact@v4
        with: { name: voice-ab, path: "ab/*.mp3\nab/ab.json", retention-days: 14 }

  gallery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: what-if-studio/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: |
          pip install -q torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy pillow open_clip_torch
      - run: cd what-if-studio && npm ci --no-audit --no-fund
      - run: python tools/gallery.py "${{ inputs.sets }}" new && python tools/gallery.py all all
      - uses: actions/upload-artifact@v4
        with: { name: gallery, path: "what-if-studio/out/gallery-*/sheet.jpg\nwhat-if-studio/out/gallery-*/distances.json", retention-days: 14 }
